# Build the MkDocs site and publish it to the gh-pages branch.
# After the first successful run: Settings -> Pages -> Source = gh-pages branch.
name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/web/**'
      - 'mkdocs.yml'
      - 'src/**'                 # so docstring (mkdocstrings) changes redeploy
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # mkdocstrings imports the package at build time. The viewer API page
      # pulls in the Qt/PyVista stack, so install the viewer extras and the
      # system GL libraries, and build under a virtual display.
      - name: System libraries for the viewer (Qt/OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libegl1 xvfb \
            libxkbcommon-x11-0 libdbus-1-3

      - name: Install the package (for mkdocstrings imports)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[viewer]

      - name: Install docs dependencies
        run: pip install mkdocs-material "mkdocstrings[python]"

      - name: Build & deploy to gh-pages
        run: xvfb-run -a mkdocs gh-deploy --force
